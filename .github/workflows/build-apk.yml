name: Build Fire TV APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
      KEYSTORE_B64: ${{ secrets.HARBOUR_KEYSTORE_B64 }}
      HARBOUR_KEYSTORE_PASSWORD: ${{ secrets.HARBOUR_KEYSTORE_PASSWORD }}
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Signing key (optional but recommended)
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/harbour.jks"
            echo "HARBOUR_KEYSTORE=$RUNNER_TEMP/harbour.jks" >> "$GITHUB_ENV"
            echo "Using your release key."
          else
            echo "::warning::No HARBOUR_KEYSTORE_B64 secret — APK is debug-signed, so updates need an uninstall first. See README."
          fi

      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/release/*.apk ../dist/Harbour.apk
          ls -la ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: Harbour-${{ env.VERSION_NAME }}
          path: dist/Harbour.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Harbour ${{ env.VERSION_NAME }}
          make_latest: true
          files: dist/Harbour.apk
