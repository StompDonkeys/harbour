<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Harbour">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/m/manifest.webmanifest">
<link rel="apple-touch-icon" href="/m/apple-touch-icon.png">
<link rel="icon" href="/m/favicon-32.png" sizes="32x32">
<link rel="apple-touch-startup-image" href="/m/launch-1179.png" media="(device-width: 393px) and (-webkit-device-pixel-ratio: 3)">
<title>Harbour</title>
<style>
:root {
  --bg: #f2f2f7; --bg-plain: #ffffff; --cell: #ffffff; --cell-2: #e5e5ea; --fill: rgba(118,118,128,.12);
  --label: #000; --label-2: rgba(60,60,67,.6); --label-3: rgba(60,60,67,.3);
  --sep: rgba(60,60,67,.29); --tint: #007aff; --red: #ff3b30; --green: #34c759; --orange: #ff9500;
  --bar: rgba(249,249,249,.82); --sheet-dim: rgba(0,0,0,.35); --skeleton: #e5e5ea;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  --top: env(safe-area-inset-top, 0px); --bottom: env(safe-area-inset-bottom, 0px);
  --tabbar: calc(50px + var(--bottom));
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000; --bg-plain: #000; --cell: #1c1c1e; --cell-2: #2c2c2e; --fill: rgba(118,118,128,.24);
    --label: #fff; --label-2: rgba(235,235,245,.6); --label-3: rgba(235,235,245,.3);
    --sep: rgba(84,84,88,.6); --tint: #0a84ff; --red: #ff453a; --green: #30d158; --orange: #ff9f0a;
    --bar: rgba(22,22,23,.82); --sheet-dim: rgba(0,0,0,.55); --skeleton: #2c2c2e;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg);
  color: var(--label); font-family: var(--font); font-size: 17px; line-height: 1.29; -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select { font: inherit; color: inherit; }
img { display: block; }
.hidden { display: none !important; }

/* ---------------------------------------------------------------- tabs & screens */
#app { position: fixed; inset: 0; }
.tab { position: absolute; inset: 0; overflow: hidden; }
.screen { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
  background: var(--bg); padding-bottom: calc(var(--tabbar) + 24px); will-change: transform;
  transition: transform .35s cubic-bezier(.2,.8,.2,1), filter .35s; overscroll-behavior-y: contain; }
.screen.plain { background: var(--bg-plain); }
.screen.below { transform: translateX(-28%); filter: brightness(.92); pointer-events: none; }
.screen.enter { transform: translateX(100%); }
.screen.dragging { transition: none; }

/* ---- wide screens: iPhone Duo opened, landscape, iPad ---- */
:root { --pane-a: 50%; --pane-b: 50%; }
.pane-empty { display: none; }
.tab.split .screen.root { right: calc(100% - var(--pane-a)); box-shadow: .5px 0 0 var(--sep); z-index: 1; }
.tab.split .screen:not(.root) { left: var(--pane-b); }
.tab.split .screen.root.below { transform: none; filter: none; pointer-events: auto; }
.tab.split .screen:not(.root).below { transform: none; filter: none; opacity: 0; }
.tab.split.solo .pane-empty { display: flex; position: absolute; top: 0; bottom: var(--tabbar); left: var(--pane-b); right: 0;
  flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; color: var(--label-2);
  font-size: 15px; background: var(--bg); }
.pane-empty .t { font-size: 22px; font-weight: 700; color: var(--label-3); margin-bottom: 6px; }
html.wide .tab:not(.split) .screen > div:last-child, html.wide .tab:not(.split) .large-title { max-width: 760px; margin-left: auto; margin-right: auto; }
html.wide .tab:not(.split) .large-title { padding-left: 16px; }
html.wide #login > * { max-width: 460px; margin-left: auto; margin-right: auto; }
html.wide #login .btn { display: block; width: 428px; margin: 0 auto; }
html.wide .sheet { left: 50%; right: auto; width: 420px; margin-left: -210px; }
html.wide #tabbar { justify-content: center; }
html.wide #tabbar button { flex: 0 1 110px; }
html.wide .modal.trailer .mbody > div:first-child { max-width: 1100px; margin: 0 auto; }
/* landscape & notch / under-display camera: keep content clear of the sides */
.screen, #tabbar { padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }

.navbar { position: sticky; top: 0; z-index: 5; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  height: calc(44px + var(--top)); padding: var(--top) 8px 0; background: transparent;
  transition: background .2s, box-shadow .2s; }
.navbar.solid, .screen:not(.root) .navbar.over-hero.solid { background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px); box-shadow: 0 .5px 0 var(--sep); }
.navbar .title { font-weight: 600; font-size: 17px; text-align: center; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; max-width: 60vw; opacity: 0; transition: opacity .2s; }
.navbar.solid .title, .navbar.always .title { opacity: 1; }
.navbar .left, .navbar .right { display: flex; align-items: center; gap: 4px; min-width: 0; }
.navbar .right { justify-content: flex-end; }
.navbtn { color: var(--tint); height: 44px; padding: 0 8px; display: inline-flex; align-items: center; gap: 2px;
  font-size: 17px; white-space: nowrap; max-width: 34vw; overflow: hidden; text-overflow: ellipsis; }
.navbtn svg { width: 22px; height: 22px; flex: none; }
.navbtn.back svg { width: 13px; height: 21px; margin-right: 4px; }
.navbtn.bold { font-weight: 600; }
.navbtn:disabled { opacity: .35; }
.navbar.over-hero:not(.solid) .navbtn { color: #fff; filter: drop-shadow(0 1px 3px rgba(0,0,0,.6)); }
.navbar.over-hero { margin-bottom: calc(-44px - var(--top)); }
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 16px 2px; font-size: 20px; font-weight: 700; letter-spacing: -.2px; }
.brand img { width: 34px; height: 34px; border-radius: 9px; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
html.wide .tab:not(.split) .brand { max-width: 760px; margin-left: auto; margin-right: auto; }
.large-title { font-size: 34px; font-weight: 700; letter-spacing: .37px; padding: 0 16px 8px; margin: 2px 0 0; }

/* tab bar */
#tabbar { position: fixed; left: 0; right: 0; bottom: 0; height: var(--tabbar); padding-bottom: var(--bottom);
  display: flex; background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  box-shadow: 0 -.5px 0 var(--sep); z-index: 20; }
#tabbar button { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--label-2); font-size: 10px; font-weight: 500; letter-spacing: .1px; padding-top: 2px; }
#tabbar button svg { width: 26px; height: 26px; }
#tabbar button.on { color: var(--tint); }

/* ---------------------------------------------------------------- grouped lists */
.section { margin: 0 16px 35px; }
.section-head { font-size: 13px; text-transform: uppercase; color: var(--label-2); padding: 0 16px 7px; letter-spacing: -.08px; }
.section-foot { font-size: 13px; color: var(--label-2); padding: 7px 16px 0; line-height: 1.35; }
.group { background: var(--cell); border-radius: 10px; overflow: hidden; }
.cell { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 16px; position: relative; width: 100%;
  text-align: left; background: var(--cell); }
.cell + .cell::before { content: ""; position: absolute; top: 0; left: var(--inset, 16px); right: 0; height: .5px; background: var(--sep); }
button.cell:active, .cell.tap:active { background: var(--cell-2); }
.cell .main { flex: 1; min-width: 0; padding: 11px 0; }
.cell .t { overflow: hidden; text-overflow: ellipsis; }
.cell .s { font-size: 13px; color: var(--label-2); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; }
.cell .v { color: var(--label-2); text-align: right; max-width: 62%; overflow-wrap: anywhere; padding: 11px 0; }
.cell .chev { width: 8px; height: 13px; color: var(--label-3); flex: none; }
.cell .mini { width: 22px; height: 22px; color: var(--label-3); flex: none; }
.cell.tint { color: var(--tint); }
.cell.danger { color: var(--red); }
.cell.center { justify-content: center; }
.cell .icon { width: 29px; height: 29px; border-radius: 7px; display: grid; place-items: center; flex: none; color: #fff; }
.cell .icon svg { width: 18px; height: 18px; }
.nowrap .t, .nowrap .s { white-space: nowrap; }

/* fields */
.field { display: block; padding: 10px 16px; position: relative; }
.field + .field::before, .cell + .field::before, .field + .cell::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: .5px; background: var(--sep); }
.field .lbl { font-size: 13px; color: var(--label-2); margin-bottom: 3px; }
.field input { width: 100%; border: 0; outline: 0; background: none; padding: 2px 0; font-size: 17px; }
.field input::placeholder { color: var(--label-3); }
.field .help { font-size: 12px; color: var(--label-2); margin-top: 3px; }
.switch { position: relative; width: 51px; height: 31px; flex: none; }
.switch input { opacity: 0; position: absolute; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 16px; background: var(--fill); transition: background .2s; }
.switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%;
  background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.16); transition: transform .2s; }
.switch input:checked + span { background: var(--green); }
.switch input:checked + span::after { transform: translateX(20px); }

/* segmented */
.seg { display: flex; background: var(--fill); border-radius: 9px; padding: 2px; gap: 0; }
.seg button { flex: 1; font-size: 13px; font-weight: 500; padding: 6px 10px; border-radius: 7px; white-space: nowrap; }
.seg button.on { background: var(--cell); box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04); font-weight: 600; }
@media (prefers-color-scheme: dark) { .seg button.on { background: #636366; } }
.pills { display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 12px; scrollbar-width: none; }
.pills::-webkit-scrollbar { display: none; }
.pills button { flex: none; padding: 7px 14px; border-radius: 18px; background: var(--fill); font-size: 15px; font-weight: 500; }
.pills button.on { background: var(--label); color: var(--bg-plain); }

/* search */
.search { margin: 0 16px 14px; display: flex; align-items: center; gap: 6px; background: var(--fill); border-radius: 10px;
  height: 36px; padding: 0 8px; color: var(--label-2); }
.search svg { width: 17px; height: 17px; flex: none; }
.search input { flex: 1; border: 0; outline: 0; background: none; font-size: 17px; min-width: 0; color: var(--label); }
.search input::placeholder { color: var(--label-2); }
.search .clear { width: 18px; height: 18px; border-radius: 50%; background: var(--label-3); color: var(--bg-plain);
  display: grid; place-items: center; font-size: 12px; line-height: 1; }

/* ---------------------------------------------------------------- media */
.hero { position: relative; margin: 0 16px 24px; border-radius: 14px; overflow: hidden; aspect-ratio: 16/9;
  background: var(--skeleton); display: block; width: calc(100% - 32px); text-align: left; }
.hero img { width: 100%; height: 100%; object-fit: cover; }
.hero .shade { position: absolute; inset: 0; background: linear-gradient(transparent 40%, rgba(0,0,0,.78)); }
.hero .cap { position: absolute; left: 14px; right: 14px; bottom: 12px; color: #fff; }
.hero .cap .k { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; opacity: .8; }
.hero .cap .t { font-size: 22px; font-weight: 700; margin-top: 2px; }
.hero .cap .s { font-size: 13px; opacity: .85; margin-top: 2px; }
.row { margin-bottom: 26px; }
.row-head { display: flex; align-items: baseline; justify-content: space-between; padding: 0 16px 9px; }
.row-head h2 { font-size: 20px; font-weight: 700; margin: 0; letter-spacing: .38px; }
.row-head button { color: var(--tint); font-size: 15px; }
.scroller { display: flex; gap: 10px; overflow-x: auto; padding: 0 16px; scroll-snap-type: x mandatory;
  scroll-padding: 0 16px; scrollbar-width: none; }
.scroller::-webkit-scrollbar { display: none; }
.card { flex: none; width: 112px; scroll-snap-align: start; text-align: left; }
.card.land { width: 250px; }
.art { position: relative; border-radius: 8px; overflow: hidden; background: var(--skeleton); aspect-ratio: 2/3; }
.card.land .art { aspect-ratio: 16/9; }
.art img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .25s; }
.art img.ok { opacity: 1; }
.art .ph { position: absolute; inset: 0; display: grid; place-items: center; padding: 8px; text-align: center;
  font-size: 12px; font-weight: 600; color: var(--label-2); }
.badge { position: absolute; top: 6px; left: 6px; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 5px;
  background: rgba(0,0,0,.62); color: #fff; letter-spacing: .2px; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.badge.ok { background: rgba(36,138,61,.88); }
.badge.warn { background: rgba(201,110,0,.9); }
.badge.info { background: rgba(0,100,210,.88); }
.badge.bad { background: rgba(200,40,40,.9); }
.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,.3); }
.bar i { display: block; height: 100%; background: var(--tint); }
.card .t { font-size: 13px; font-weight: 500; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .s { font-size: 12px; color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 16px 10px; padding: 0 16px; }
.grid .card { width: auto; }

.thumb { width: 44px; aspect-ratio: 2/3; border-radius: 5px; overflow: hidden; background: var(--skeleton); flex: none; margin: 8px 0; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }

/* detail */
.backdrop { position: relative; aspect-ratio: 16/10; background: var(--skeleton); overflow: hidden; }
.backdrop img { width: 100%; height: 100%; object-fit: cover; }
.backdrop::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(rgba(0,0,0,.35), transparent 30%, transparent 55%, var(--bg)); }
.dhead { display: flex; gap: 14px; padding: 0 16px; margin-top: -70px; position: relative; z-index: 1; align-items: flex-end; }
.dhead .poster { width: 104px; flex: none; border-radius: 8px; overflow: hidden; aspect-ratio: 2/3; background: var(--skeleton);
  box-shadow: 0 8px 24px rgba(0,0,0,.35); }
.dhead .poster img { width: 100%; height: 100%; object-fit: cover; }
.dhead h1 { font-size: 24px; font-weight: 700; margin: 0 0 4px; line-height: 1.15; letter-spacing: .2px; }
.dhead .sub { font-size: 14px; color: var(--label-2); }
.dhead .chip { display: inline-block; margin-top: 7px; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px;
  background: var(--fill); }
.chip.ok { color: var(--green); } .chip.warn { color: var(--orange); } .chip.info { color: var(--tint); } .chip.bad { color: var(--red); }
.overview { padding: 16px 16px 0; font-size: 15px; line-height: 1.42; color: var(--label); }
.overview.clamp { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.more-link { padding: 2px 16px 0; color: var(--tint); font-size: 15px; }
.btns { display: flex; gap: 10px; padding: 18px 16px 24px; }
.btn { flex: 1; height: 50px; border-radius: 12px; font-size: clamp(14px, 4.3vw, 17px); white-space: nowrap; font-weight: 600; background: var(--fill); color: var(--tint);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 14px; }
.btn.primary { background: var(--tint); color: #fff; }
.btn.danger { color: var(--red); }
.btn:active { opacity: .7; }
.btn:disabled { opacity: .4; }
.btn svg { width: 20px; height: 20px; }
.people { display: flex; gap: 14px; overflow-x: auto; padding: 0 16px; scrollbar-width: none; }
.people::-webkit-scrollbar { display: none; }
.person { width: 72px; flex: none; text-align: center; }
.person .ph2 { width: 72px; height: 72px; border-radius: 50%; overflow: hidden; background: var(--skeleton); display: grid;
  place-items: center; color: var(--label-2); font-weight: 600; }
.person img { width: 100%; height: 100%; object-fit: cover; }
.person .n { font-size: 12px; margin-top: 6px; line-height: 1.2; }
.person .r { font-size: 11px; color: var(--label-2); margin-top: 1px; line-height: 1.2; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--label-3); }
.dot.on { background: var(--green); }
.dot.miss { background: var(--orange); }

/* calendar */
.weekstrip { margin: 0 8px 12px; touch-action: pan-y; }
.wk-head { display: flex; align-items: center; justify-content: space-between; }
.wk-head .navbtn svg { width: 11px; height: 18px; }
.wk-month { font-weight: 600; font-size: 17px; }
.wk-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-top: 2px; }
.wk-day { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0 2px; }
.wk-day .dow { font-size: 11px; font-weight: 600; color: var(--label-2); text-transform: uppercase; }
.wk-day .num { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 19px; font-weight: 500; }
.wk-day.today .num { color: var(--red); font-weight: 600; }
.wk-day.sel .num { background: var(--label); color: var(--bg-plain); }
.wk-day.sel.today .num { background: var(--red); color: #fff; }
.wk-day .dots { height: 6px; display: flex; }
.wk-day .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--label-3); }
.cal-day.today { color: var(--red); }
.chip.purple { color: #af52de; }
.meta .chip { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 5px; background: var(--fill); text-transform: uppercase; letter-spacing: .3px; }
.modal.trailer { background: #000; }
.modal.trailer .navbar { background: rgba(28,28,30,.9); color: #fff; box-shadow: none; }
.modal.trailer .section-foot { color: rgba(235,235,245,.6); }
.modal.trailer .group, .modal.trailer .cell { background: #1c1c1e; }

/* releases */
.rel .t { font-size: 14px; font-weight: 500; overflow-wrap: anywhere; line-height: 1.3; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--label-2); margin-top: 5px; }
.meta b { font-weight: 600; color: var(--label); }
.rej { font-size: 12px; color: var(--red); margin-top: 4px; }

/* downloads */
.client { background: var(--cell); border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
.client + .client { margin-top: 10px; }
.client .main { flex: 1; min-width: 0; }
.client .t { font-weight: 600; }
.client .s { font-size: 13px; color: var(--label-2); margin-top: 2px; }
.client .speed { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.2px; }
.act-poster { width: 54px; height: 81px; flex: none; border-radius: 6px; overflow: hidden; background: var(--fill); }
.act-poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
.act-poster.sm { width: 40px; height: 60px; border-radius: 5px; }
.act-meta { font-size: 13px; color: var(--label-2); margin-top: 3px; line-height: 1.35; }
.act-chip { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 6px; background: var(--fill); color: var(--label-2); margin: 5px 5px 0 0; }
.act-chip.tx { background: rgba(255,149,0,.18); color: #ff9500; }
.act-chip.dp { background: rgba(52,199,89,.16); color: var(--green); }
.act-rank { width: 22px; flex: none; text-align: center; font-weight: 700; color: var(--label-3); font-size: 15px; }
.cmt { padding: 12px 16px; border-bottom: .5px solid var(--sep); }
.cmt:last-child { border-bottom: 0; }
.cmt .who { display: flex; align-items: baseline; gap: 6px; font-size: 14px; }
.cmt .who b { font-weight: 600; }
.cmt .who span { color: var(--label-2); font-size: 13px; }
.cmt .txt { font-size: 15px; line-height: 1.4; margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
.cmt .spoil { margin-top: 6px; padding: 10px 12px; border-radius: 10px; background: var(--fill); color: var(--label-2); font-size: 14px; width: 100%; text-align: left; }
.cmt .foot { display: flex; gap: 14px; margin-top: 6px; font-size: 13px; color: var(--label-2); }
.cmt .foot button { color: var(--tint); font-size: 13px; }
.cmt .reps { margin: 8px 0 0 12px; padding-left: 10px; border-left: 2px solid var(--fill); }
.cmt .reps .cmt { padding: 8px 0; border-bottom: 0; }
.prog { height: 4px; border-radius: 2px; background: var(--fill); margin-top: 7px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--tint); border-radius: 2px; transition: width .6s; }
.prog.paused i { background: var(--label-3); }
.prog.done i { background: var(--green); }

/* empty / errors / loading */

// ------------------------------------------------------------------ wide screens & foldables
/* On a phone (or the iPhone Duo's cover screen) every screen is full width and slides in on top.
   On a wide screen — the Duo opened, landscape phones, iPads — tabs with a list and details show

   Folding/unfolding just re-lays out the same screens, so you stay exactly where you were. */
const WIDE = matchMedia("(min-width: 600px)");
function foldGeometry() {
  // Viewport Segments API (foldables): two side-by-side segments → split exactly at the hinge.
  const segs = window.viewport && window.viewport.segments;
  const root = document.documentElement.style;
  if (segs && segs.length === 2 && segs[0].top === segs[1].top) {
    root.setProperty("--pane-a", segs[0].right + "px");
    root.setProperty("--pane-b", segs[1].left + "px");
    document.documentElement.dataset.fold = "segments";
  } else {
    root.setProperty("--pane-a", "50%");
    root.setProperty("--pane-b", "50%");
    delete document.documentElement.dataset.fold;
  }
}
function applyLayout() {
  foldGeometry();
  const wide = WIDE.matches;
  document.documentElement.classList.toggle("wide", wide);
  for (const t of Object.values(S.tabs)) {
    t.el.classList.toggle("split", wide && !!t.def.split);
    t.el.classList.toggle("solo", t.stack.length < 2);
    for (const sc of t.stack) { sc.el.style.transform = ""; sc.el.style.filter = ""; }
  }
}
const isSplit = tabId => S.tabs[tabId]?.el.classList.contains("split");
WIDE.addEventListener?.("change", applyLayout);
addEventListener("resize", () => { clearTimeout(applyLayout.t); applyLayout.t = setTimeout(applyLayout, 80); });

/** A screen: {el, title, show(), hide(), destroy()}; push() mounts it on the current tab. */
function push(screen, tabId = S.tab, isRoot = false) {
  const t = S.tabs[tabId];
  if (!isRoot && isSplit(tabId) && t.stack.length > 1 && tapScreen && tapScreen === t.stack[0].el) {
    while (t.stack.length > 1) {                      // swap the detail pane, no slide-out
      const old = t.stack.pop(); old.hide?.(); old.destroy?.(); old.el.remove();
    }
  }

function attachSwipeBack(screen) {

  }, { passive: true });
  el.addEventListener("touchmove", e => {
    if (x0 == null) return;

    if (!active && dx > 10) { active = true; el.classList.add("dragging"); below()?.el.classList.add("dragging"); }

  function show() {

      h("div", { class: "r" }, h("img", { src: url(s[1]), alt: "" })));

    for (const ahead of [idx + 1, idx + 2, idx - 1]) for (const n of spreads[ahead] || []) { const im = new Image(); im.src = url(n); }
    const cur = currentPage();

  async function save(page, completed) {
    if (!data || (page === lastSaved && !completed)) return;
    lastSaved = page;
    try { await post(`/api/comics/book/${enc(data.book.id)}/progress`, { page, completed: !!completed }); } catch { /* try again on the next page */ }
  }
  function go(d) {
    if (zoom.s > 1.01) return;
    const n = idx + d;
    if (n < 0) { if (data?.prev) toast("Start of this issue"); return; }
    if (n >= spreads.length) { endCard(); return; }

  }
  function endCard() {
    save(pages.length, true);
    const card = h("div", { class: "endcard" }, h("div", {},
      h("div", { class: "t" }, "Finished"), h("div", {}, data.book.series ? `${data.book.series} ${data.book.label || ""}` : data.book.title),
      data.next ? h("button", { class: "btn primary", onclick: () => { card.remove(); switchBook(data.next); } }, "Next issue ›") : null,
      h("button", { class: "btn", style: "margin-top:10px", onclick: () => close() }, data.next ? "Close" : "Back to the series")));

      buildSpreads();

      idx = spreadOf(start); lastSaved = data.book.page || 0;

    onClose?.();
  }
  function onResize() {

  addEventListener("resize", onResize);

  // ---- touch: tap zones, swipe, pinch / double-tap zoom, pan
  const zoom = { s: 1, x: 0, y: 0 };
  function applyZoom() { stage.style.transform = zoom.s > 1.01 ? `translate(${zoom.x}px,${zoom.y}px) scale(${zoom.s})` : ""; }
  function clampZoom() {
    const W = innerWidth, H = innerHeight;
    zoom.x = Math.min(0, Math.max(W - W * zoom.s, zoom.x));

  function resetZoom() { zoom.s = 1; zoom.x = 0; zoom.y = 0; applyZoom(); }

    if (pts.size === 2) {

    }
    // a tap: double-tap zooms, edges turn the page, the middle shows the controls
    const now = Date.now();
    if (now - lastTap < 280) { lastTap = 0; clearTimeout(up.single); zoomAt(e.clientX, e.clientY, zoom.s > 1.01 ? 1 : 2.5); return; }
    lastTap = now;
    const x = e.clientX / innerWidth;
    clearTimeout(up.single);
    up.single = setTimeout(() => {
      if (zoom.s > 1.01) { el.classList.toggle("ui"); return; }
      if (x > 0.7) go(1); else if (x < 0.3) go(-1);

    }, 230);
  };
  el.addEventListener("pointerup", up);
  el.addEventListener("pointercancel", e => { pts.delete(e.pointerId); start = null; pinch = null; });
  await loadBook(bookId, false);
}

const ago = t => {
  if (!t) return "";
  const s = Date.now() / 1000 - t;
  if (s < 90) return "just now";
  if (s < 3600) return `${Math.round(s / 60)} min ago`;
  if (s < 86400) return `${Math.round(s / 3600)} h ago`;
  if (s < 7 * 86400) return new Date(t * 1000).toLocaleDateString(undefined, { weekday: "short" }) + " " +
    new Date(t * 1000).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  return fmtDate(t);
};
const fmtLen = s => { s = Math.round(s || 0); const hr = Math.floor(s / 3600), m = Math.round(s % 3600 / 60); return hr ? `${hr}h ${m}m` : `${m}m`; };

/** Plex activity from Tautulli: Now playing, History, Top. */
function ActivityScreen() {
  const p = page({ title: "Plex activity", back: prevTitle() });

      const a = await get("/api/activity");

      if (!a.streams.length) { box.replaceChildren(emptyState("Nobody's watching", "Streams show up here as soon as someone presses play.")); return; }
      box.replaceChildren(
        h("div", { class: "section-head" }, `${a.count} stream${a.count === 1 ? "" : "s"} · ${fmtKbps(a.bandwidth)}` +

              h("div", { class: "act-meta" }, [x.state === "paused" ? "⏸ Paused" : x.state === "buffering" ? "Buffering…" : "▶ Playing",

  const moreBox = h("div", {});

  add(row.items);
  async function more() {

  p.body.append(grid, moreBox);

    if (!link || (data.actions || []).some(a => a.opens === "youtube" || a.opens === "trailer")) return;

    const primary = acts.filter(a => a.style === "primary" && !isTrailer(a)).slice(0, trailerAct ? 1 : 2);
    const rest = acts.filter(a => !primary.includes(a) && !isTrailer(a));
    kids.push(h("div", { class: "btns" }, primary.map(a => actionButton(a, "btn primary")),
      trailerAct && h("button", { class: "btn" + (primary.length ? "" : " primary"), onclick: () => openTrailer(trailerAct.arg, it.title) }, svg("play"), "Trailer"),
      rest.length ? h("button", { class: "btn", style: primary.length || trailerAct ? "flex:0 0 50px;padding:0" : "", onclick: () => moreActions(rest, it.title) },
        svg("more"), primary.length || trailerAct ? "" : "Actions") : null));
    if (d.seasons?.length) {
      kids.push(h("div", { class: "section-head" }, "Seasons"),
        h("div", { class: "section" }, h("div", { class: "group" }, d.seasons.map(s => h("button", { class: "cell", onclick: () => push(SeasonScreen(svc, id, s, it.title, reload)) },
          h("div", { class: "main" }, h("div", { class: "t" }, s.label), s.subtitle && h("div", { class: "s" }, s.subtitle)),

          h("div", { class: "cell" }, h("div", { class: "main", style: "flex:none;color:var(--label)" }, f.label), h("div", { class: "v", style: "flex:1" }, f.value))))));

        h("div", { class: "people" }, d.people.map(pe => {
          const ph = h("div", { class: "ph2" }, (pe.name || "?").split(" ").map(w => w[0]).slice(0, 2).join(""));
          if (pe.photo) { const im = h("img", { src: pe.photo, alt: "", loading: "lazy" }); im.onload = () => { ph.textContent = ""; ph.append(im); }; }
          return h("button", { class: "person", onclick: () => push(DetailScreen(svc, pe.id, { title: pe.name, poster: pe.photo })) },
            ph, h("div", { class: "n" }, pe.name), pe.role && h("div", { class: "r" }, pe.role));

      .then(i => { if (i != null) runAction(svc, id, list[i], it(), reload); });
  }

    if (res?.close) { pop(); return; }

  }

/** Run one gateway action: confirm / choose first, open screens for "opens", then toast the result. */
async function runAction(svc, itemId, a, item, after, btn) {
  if (a.items?.length) {
    const i = await actionSheet(a.label, null, a.items.map((x, k) => ({ label: x.label, value: k, danger: x.style === "danger" })));
    if (i != null) return runAction(svc, itemId, a.items[i], item, after, btn);
    return;
  }
  if (a.opens === "releases") { push(ReleasesScreen(svc, itemId, a.arg, item.title, after)); return; }
  if (a.opens === "youtube" || a.opens === "trailer") { openTrailer(a.arg, item.title); return; }
  if (a.opens === "item" && a.arg) {                 // e.g. "hub/hub/movie-123": that service's page for it
    const [kind, inst, ...rest] = a.arg.split("/");
    const target = (S.config?.services || []).find(s => s.kind === kind && s.inst === inst) || { kind, inst, name: item.title };
    push(DetailScreen(target, rest.join("/"), { title: item.title, poster: item.poster, backdrop: item.backdrop }));
    return;
  }
  if (a.opens === "discuss" && a.arg) { push(DiscussScreen(a.arg, item.title)); return; }
  if (a.opens === "play" || a.opens === "plex") { toast("Playing from Plex is on the TV app for now"); return; }
  if (a.opens) { toast("That one's on the TV app for now"); return; }
  let choice = null;
  if (a.choose?.options?.length) {
    if (a.choose.options.length === 1) choice = a.choose.options[0].value;
    else {
      choice = await actionSheet(a.choose.title || a.label, null, a.choose.options.map(o => ({ label: o.label, value: o.value })));
      if (choice == null) return;
    }
  }
  if (a.confirm) {
    const danger = a.style === "danger" || /delete|remove/i.test(a.id);
    if (!await confirmBox(a.label, a.confirm, a.label, danger)) return;
  }
  const label = btn?.textContent;
  if (btn) { btn.disabled = true; btn.replaceChildren(h("span", { class: "spin small", style: "border-top-color:currentColor" })); }
  try {
    const body = { action: a.id };
    if (a.arg != null) body.arg = a.arg;
    if (choice != null) body.choice = choice;
    const r = await post(`${svcPath(svc)}/item/${enc(itemId)}/action`, body);
    toast(r.message || "Done");
    markBelowStale();
    if (r.close || r.refresh !== false) after?.(r);
  } catch (e) { errToast(e); }
  finally { if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = label; } }
}
function markBelowStale() { for (const s of S.tabs[S.tab].stack) s.markStale?.(); }

    box.replaceChildren(list.length ? h("div", { class: "section" }, h("div", { class: "group" }, list.map(c => comment(c))))

function openTrailer(key, title) {

  const watch = `https://www.youtube.com/watch?v=${enc(key)}`;

    src: `https://www.youtube-nocookie.com/embed/${enc(key)}?playsinline=1&autoplay=1&rel=0&modestbranding=1`,
    title: title ? `${title} trailer` : "Trailer", allow: "autoplay; encrypted-media; picture-in-picture; fullscreen",
    allowfullscreen: true, referrerpolicy: "strict-origin-when-cross-origin",
    style: "position:absolute;inset:0;width:100%;height:100%;border:0",
  });
  const m = h("div", { class: "modal trailer" },
    h("div", { class: "navbar always solid" }, h("div", { class: "left" }),
      h("div", { class: "title" }, title ? `${title}` : "Trailer"),
      h("div", { class: "right" }, h("button", { class: "navbtn bold", onclick: () => close() }, "Done"))),
    h("div", { class: "mbody", style: "display:flex;flex-direction:column;justify-content:center" },
      h("div", { style: "position:relative;width:100%;aspect-ratio:16/9;background:#000" }, frame),
      h("div", { class: "section", style: "margin-top:22px" }, h("div", { class: "group" },

// ------------------------------------------------------------------ manual search
function ReleasesScreen(svc, itemId, arg, title, after) {
  const p = page({ title: "Manual search", back: "Back" });

// ------------------------------------------------------------------ Calendar
const CAL_TONE = { downloaded: "ok", downloading: "info", airing: "bad", missing: "warn", upcoming: "", cinema: "purple", unmonitored: "" };
const isoDay = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -((x.getDay() + 6) % 7)); };

function CalendarScreen() {
  const todayBtn = h("button", { class: "navbtn", onclick: () => { sel = new Date(); week = mondayOf(sel); draw(true); } }, "Today");
  const p = page({ title: "Calendar", large: true, right: [todayBtn] });
  let week = mondayOf(new Date()), sel = new Date(), filter = lsGet("calFilter", "all");
  let win = null, entries = [], loading = false, failed = null;
  const strip = h("div", { class: "weekstrip" });
  const pills = h("div", { class: "pills" });
  const list = h("div", {});
  p.body.append(strip, pills, list);

  // swipe the week strip to change weeks
  let sx = null;
  strip.addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive: true });
  strip.addEventListener("touchend", e => {
    if (sx == null) return;
    const dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 50) shift(dx < 0 ? 1 : -1);
  });
  function shift(n) {
    week = addDays(week, 7 * n);
    sel = isoDay(mondayOf(new Date())) === isoDay(week) ? new Date() : week;   // land on today in this week
    draw(true);
  }

  async function ensure() {
    const a = isoDay(week), b = isoDay(addDays(week, 6));
    if (win && a >= win[0] && b <= win[1]) return;
    const start = addDays(week, -7), end = addDays(week, 41);      // 7 weeks per fetch (gateway allows 70 days)
    loading = true; failed = null; drawList();
    try {
      const r = await get(`/api/calendar?start=${isoDay(start)}&end=${isoDay(end)}`);
      win = [isoDay(start), isoDay(end)]; entries = r.entries || [];
    } catch (e) { failed = e; }
    loading = false;
  }
  const shown = () => entries.filter(e => filter === "all" || (filter === "tv" ? e.kind === "tv" : e.kind === "movie"));
  async function draw(scroll) {
    drawStrip(); drawPills();
    await ensure();
    drawStrip(); drawList();
    if (scroll) jump(isoDay(sel));
  }
  function drawStrip() {
    const today = isoDay(new Date());
    const counts = {};
    for (const e of shown()) counts[e.date] = (counts[e.date] || 0) + 1;
    const days = [...Array(7)].map((_, i) => addDays(week, i));
    const mid = days[3];
    strip.replaceChildren(
      h("div", { class: "wk-head" },
        h("button", { class: "navbtn", "aria-label": "Previous week", onclick: () => shift(-1) }, svg("back")),
        h("div", { class: "wk-month" }, mid.toLocaleDateString(undefined, { month: "long", year: "numeric" })),
        h("button", { class: "navbtn", "aria-label": "Next week", style: "transform:scaleX(-1)", onclick: () => shift(1) }, svg("back"))),
      h("div", { class: "wk-days" }, days.map(d => {
        const k = isoDay(d);
        return h("button", { class: "wk-day" + (k === isoDay(sel) ? " sel" : "") + (k === today ? " today" : ""),
          onclick: () => { sel = d; drawStrip(); jump(k); } },
          h("span", { class: "dow" }, d.toLocaleDateString(undefined, { weekday: "narrow" })),

/** Edit one service entry (index -1 = new). Saving sends every section back; blank secrets mean "keep". */
function EditScreen(sec, index) {
  const sch = SETTINGS.schema[sec];
  const isNew = index < 0 || (sch.single && !SETTINGS.values[sec]);
  const src = sch.multi ? (index >= 0 ? SETTINGS.values[sec][index] : {}) : (SETTINGS.values[sec] || {});

  const title = sch.multi ? (isNew ? `New ${sch.title}` : (entry.name || sch.title)) : sch.title;
  const saveBtn = h("button", { class: "navbtn bold", onclick: () => save() }, "Save");
  const p = page({ title, back: "Settings", right: [saveBtn] });
  const inputs = {};
  const testOut = h("div", {});
  const fields = sch.fields.map(f => {
    const v = entry[f.key];
    if (f.type === "bool") {
      const inp = h("input", { type: "checkbox" }); inp.checked = v ?? f.default ?? false;
      inputs[f.key] = () => inp.checked;
      return h("label", { class: "cell" }, h("div", { class: "main" }, f.label), h("span", { class: "switch" }, inp, h("span", {})));
    }
    if (f.type === "choice") {
      let val = v || "";
      const seg = h("div", { class: "seg", style: "flex:0 0 auto;min-width:150px" });
      const draw = () => seg.replaceChildren(...f.options.map((o, i) => h("button", { class: o === val ? "on" : "", onclick: () => { val = o; draw(); } }, f.labels?.[i] || o || "Default")));
      draw(); inputs[f.key] = () => val;
      return h("div", { class: "cell" }, h("div", { class: "main" }, f.label), seg);
    }
    const isSecret = f.type === "secret", has = (entry._set || []).includes(f.key);
    const inp = h("input", {
      type: isSecret ? "password" : f.type === "url" ? "url" : "text", value: isSecret ? "" : (v ?? ""),
      placeholder: isSecret ? (has ? "Saved — leave blank to keep" : (f.required ? "Required" : "Optional")) : (f.placeholder || ""),
      autocapitalize: "off", autocorrect: "off", spellcheck: "false", autocomplete: isSecret ? "new-password" : "off",
      inputmode: f.type === "url" ? "url" : null,
    });
    if (isSecret) {
      const eye = h("button", { class: "navbtn", style: "height:24px;padding:0 0 0 8px;font-size:15px;flex:none;max-width:none", onclick: e => { e.preventDefault(); inp.type = inp.type === "password" ? "text" : "password"; eye.textContent = inp.type === "password" ? "Show" : "Hide"; } }, "Show");
      inputs[f.key] = () => inp.value.trim();
      return h("label", { class: "field" }, h("div", { class: "lbl" }, f.label), h("div", { style: "display:flex;align-items:center" }, inp, eye), f.help && h("div", { class: "help" }, f.help));
    }
    inputs[f.key] = () => inp.value.trim();
    return h("label", { class: "field" }, h("div", { class: "lbl" }, f.label), inp, f.help && h("div", { class: "help" }, f.help));
  });
  const kids = [h("div", { class: "section", style: "margin-top:12px" }, h("div", { class: "group" }, fields))];
  if (sch.test) kids.push(h("div", { class: "section" }, h("div", { class: "group" }, h("button", { class: "cell tint center", onclick: test }, "Test connection")), testOut));
  if (!isNew && (sch.multi || sch.optional)) kids.push(h("div", { class: "section" }, h("div", { class: "group" },
    h("button", { class: "cell center danger", onclick: remove }, sch.multi ? `Remove ${entry.name || sch.title}` : `Turn off ${sch.title}`))));
  if (sec === "general") kids.push(h("div", { class: "section-foot", style: "margin:-20px 16px 0" },
    "The gateway PIN logs you in to the setup page. Paired TVs use their own keys, so they keep working if you change it."));
  p.body.append(...kids);

  function collect() {
    const out = { ...(entry.id ? { id: entry.id } : {}) };
    for (const f of sch.fields) out[f.key] = inputs[f.key]();
    return out;
  }
  async function test() {
    testOut.replaceChildren(h("div", { class: "testres" }, h("span", { class: "spin small" }), "  Testing…"));
    try {
      const r = await post("/api/settings/test", { section: sec, entry: collect() });
      testOut.replaceChildren(h("div", { class: "testres " + (r.ok ? "ok" : "bad") }, (r.ok ? "✓ " : "✕ ") + r.message));
    } catch (e) { testOut.replaceChildren(h("div", { class: "testres bad" }, "✕ " + e.message)); }
  }
  function valuesWith(mutate) {
    const vals = JSON.parse(JSON.stringify(SETTINGS.values));
    for (const s of Object.keys(vals)) {                 // never send the "_set" markers back
      const strip = e => { if (e) delete e._set; return e; };

  function save() {
    const e = collect();
    put(valuesWith(v => {

  }
  return { el: p.el, title };
}

async function afterSettingsChange() {
  await loadSettings();
  const old = JSON.stringify((S.config?.services || []).map(s => [s.kind, s.inst, s.name])) + S.config?.files + S.config?.downloads + S.config?.xdl;
  S.config = await get("/api/config");
  const now = JSON.stringify(S.config.services.map(s => [s.kind, s.inst, s.name])) + S.config.files + S.config.downloads + S.config.xdl;
  if (old !== now) {                       // services changed: rebuild the other tabs, keep Settings where it is
    const keep = S.tabs.settings;
    for (const [id, t] of Object.entries(S.tabs)) if (id !== "settings") { t.stack.forEach(s => s.destroy?.()); t.el.remove(); }
    const bar = $("#tabbar"); bar.innerHTML = "";
    const app = $("#app");
    const visible = TABS.filter(t => t.show());
    S.tabs = {};
    for (const t of visible) {
      if (t.id === "settings") { S.tabs.settings = keep; app.append(keep.el); }
      else { const el = makeTabEl(t); app.insertBefore(el, keep.el); S.tabs[t.id] = { el, stack: [], def: t }; }
      bar.append(h("button", { "data-tab": t.id, class: t.id === "settings" ? "on" : "", onclick: () => selectTab(t.id) }, svg(t.icon), t.label));
    }
    applyLayout();
  }
  for (const s of S.tabs.settings.stack) s.refreshIfStale?.();
}

function showLogin(status) {
  const box = $("#login");
  if (!box.classList.contains("hidden") && !status) return;
  $("#tabbar").classList.add("hidden");
  box.classList.remove("hidden");
  const setup = status ? status.setup_needed : false;
  const name = status?.name || "Harbour";
  const err = h("div", { class: "err" });
  const token = h("input", { type: "password", autocomplete: "off", autocapitalize: "off", autocorrect: "off", spellcheck: "false", placeholder: "The PIN from the setup page" });
  const pw = h("input", { type: "password", autocomplete: setup ? "new-password" : "current-password", placeholder: setup ? "At least 8 characters" : "Password" });
  const pw2 = h("input", { type: "password", autocomplete: "new-password", placeholder: "Repeat it" });
  const btn = h("button", { class: "btn primary", onclick: () => go() }, setup ? "Set password" : "Sign in");
  const form = h("form", { onsubmit: e => { e.preventDefault(); go(); } },
    h("div", { class: "section" }, h("div", { class: "group" },
      setup && h("label", { class: "field" }, h("div", { class: "lbl" }, "Gateway PIN"), token),
      h("label", { class: "field" }, h("div", { class: "lbl" }, setup ? "New password" : "Password"), pw),
      setup && h("label", { class: "field" }, h("div", { class: "lbl" }, "Confirm password"), pw2))),
    err, btn, h("input", { type: "submit", class: "hidden" }));
  box.replaceChildren(
    h("div", { class: "logo" }, h("img", { src: "/m/apple-touch-icon.png", alt: "" })),

      : "Sign in to manage your NAS."),
    form);
  setTimeout(() => (setup ? token : pw).focus(), 300);
  async function go() {
    err.textContent = "";
    if (setup && pw.value !== pw2.value) { err.textContent = "The passwords don't match"; return; }

// ------------------------------------------------------------------ start
async function start() {
  let st;
  try { st = await get("/api/login/status"); }
  catch (e) { $("#app").replaceChildren(emptyState("Can't reach Harbour", e.message, () => location.reload())); return; }
  if (!st.signed_in) {
    // On the home network the gateway may still let us in without a password (no password set yet,
    // and no token configured); otherwise show sign-in or first-run setup.
    try { if (st.setup_needed) throw 0; S.config = await get("/api/config"); }
    catch (e) { showLogin(st); return; }
  }
  try { S.config = S.config || await get("/api/config"); }
  catch (e) { if (!(e instanceof NeedLogin)) $("#app").replaceChildren(emptyState("Can't reach Harbour", e.message, () => location.reload())); return; }
  buildTabs();
}
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && S.tabs[S.tab]) topOf(S.tabs[S.tab])?.show?.();
  if (!document.hidden) checkForNewVersion();
});
// A Home Screen app can stay open for days. When the gateway has been updated, load the new app.
let lastVersionCheck = 0;
async function checkForNewVersion() {
  if (Date.now() - lastVersionCheck < 60000 || !S.config?.version) return;
  lastVersionCheck = Date.now();
  try {
    const c = await get("/api/config");
    if (c.version && c.version !== S.config.version) location.reload();
  } catch { /* offline or signed out — try again later */ }
}
setInterval(() => { if (!document.hidden) checkForNewVersion(); }, 5 * 60000);
start();
</script>
</body>
