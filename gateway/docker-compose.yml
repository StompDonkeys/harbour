# Harbour V3 gateway — Synology Container Manager → Project → Create → paste this.
# Then open http://<your NAS>:8765/setup in a browser to set it up.
services:
  harbour-gateway:
    image: ghcr.io/stompdonkeys/harbour-gateway:latest
    container_name: harbour-gateway
    user: "1035:100"            # your Docker user (dockerlimited); change if yours differs
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - ./config:/config            # settings saved from the setup page and the iPhone app
      - /volume1/docker:/stack:ro   # optional: lets the setup page find your apps' API keys
    environment:
      - TZ=Australia/Sydney
